<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>粗利計算</title>
  <style>
    :root{color-scheme:light;--ink:#17201d;--muted:#68736f;--green:#176b51;--mint:#e8f4ef;--line:#dce5e1}*{box-sizing:border-box}html{background:#edf2ef}body{margin:0;color:var(--ink);background:radial-gradient(circle at 20% 0%,#fff 0,#f5f8f6 42%,#e7eeea 100%);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI",sans-serif}button,input{font:inherit}main{min-height:100svh;display:grid;place-items:center;padding:18px}.card{width:min(100%,430px);background:#fffffff0;border:1px solid #fff;border-radius:28px;padding:24px 20px 18px;box-shadow:0 18px 60px #1c3e311f}header{display:flex;align-items:center;gap:13px;margin-bottom:22px}.mark{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;color:#fff;background:var(--green);font-size:25px;font-weight:750}.tax{margin:0 0 2px;color:var(--green);font-size:12px;font-weight:700;letter-spacing:.08em}h1{margin:0;font-size:28px}.guide{display:flex;gap:12px;align-items:center;padding:13px 14px;margin-bottom:18px;background:var(--mint);border-radius:17px;color:#315248}.guide>span{width:28px;height:28px;flex:none;display:grid;place-items:center;color:#fff;background:var(--green);border-radius:50%;font-weight:700}.guide p{margin:0;font-size:13px;line-height:1.55}.guide strong{color:var(--ink);font-size:14px}.fields{display:grid;gap:12px}.field{display:block}.label{display:flex;justify-content:space-between;margin:0 3px 6px;font-size:13px;font-weight:700}.label small{color:var(--green);font-size:11px}.wrap{display:flex;align-items:center;background:#fff;border:1.5px solid var(--line);border-radius:15px;overflow:hidden}.wrap:focus-within{border-color:var(--green);box-shadow:0 0 0 4px #176b5117}.calculated .wrap{background:#f1f8f5;border-color:#bcd9ce}input{width:100%;min-width:0;height:54px;padding:0 8px 0 16px;border:0;outline:0;background:transparent;font-size:19px;font-weight:650;color:var(--ink)}input::placeholder{color:#aeb7b3;font-size:14px;font-weight:400}.unit{padding-right:15px;color:var(--muted);font-size:14px;font-weight:700}.error{display:none;margin:12px 0 0;padding:10px 12px;background:#fff1ef;color:#a33b2f;border-radius:12px;font-size:13px}.result{margin-top:17px;padding:17px;background:#eef2f0;color:#7a8581;border-radius:18px;text-align:center}.result.ready{background:linear-gradient(135deg,#176b51,#125340);color:#fff}.result p{margin:0 0 3px;font-size:12px}.result strong{display:block;font-size:28px}.result span{display:block;margin-top:3px;font-size:11px;opacity:.75}.clear{width:100%;min-height:48px;margin-top:12px;border:0;border-radius:14px;color:#52605b;background:transparent;font-weight:650}footer{text-align:center;color:#929b97;font-size:10px}@media(max-width:360px){main{padding:8px}.card{border-radius:22px;padding:19px 15px 15px}input{height:50px}.fields{gap:9px}}
  </style>
</head>
<body><main><section class="card">
  <header><div class="mark">¥</div><div><p class="tax">消費税 10％</p><h1>粗利計算</h1></div></header>
  <div class="guide"><span>1</span><p><strong>わかる項目を2つ入力</strong><br>残りは自動で計算します</p></div>
  <div class="fields">
    <label class="field" data-key="cost"><span class="label">仕入れ値 <small></small></span><span class="wrap"><input inputmode="decimal" placeholder="例：6,000"><b class="unit">円</b></span></label>
    <label class="field" data-key="net"><span class="label">販売価格（税抜） <small></small></span><span class="wrap"><input inputmode="decimal" placeholder="例：10,000"><b class="unit">円</b></span></label>
    <label class="field" data-key="gross"><span class="label">販売価格（税込） <small></small></span><span class="wrap"><input inputmode="decimal" placeholder="例：11,000"><b class="unit">円</b></span></label>
    <label class="field" data-key="rate"><span class="label">粗利率 <small></small></span><span class="wrap"><input inputmode="decimal" placeholder="例：40"><b class="unit">％</b></span></label>
  </div>
  <p class="error" role="alert"></p>
  <div class="result"><p>1個あたりの粗利額</p><strong>—</strong><span>2つ入力すると表示されます</span></div>
  <button class="clear" type="button">入力をすべて消す</button><footer>金額は1円単位で四捨五入して表示します</footer>
</section></main>
<script>
const keys=['cost','net','gross','rate'],values={cost:'',net:'',gross:'',rate:''};let edited=[];
const yen=n=>Math.round(n).toLocaleString('ja-JP');
const num=s=>s.trim()===''?undefined:(Number.isFinite(Number(s.replaceAll(',','')))&&Number(s.replaceAll(',',''))>=0?Number(s.replaceAll(',','')):undefined);
function calc(){const v=Object.fromEntries(keys.map(k=>[k,num(values[k])])),chosen=edited.filter(k=>v[k]!==undefined).slice(-2),has=k=>chosen.includes(k);let error='';
if(has('cost')&&has('net')){v.gross=v.net*1.1;v.rate=v.net===0?0:(v.net-v.cost)/v.net*100}
else if(has('cost')&&has('gross')){v.net=v.gross/1.1;v.rate=v.net===0?0:(v.net-v.cost)/v.net*100}
else if(has('cost')&&has('rate')){if(v.rate>=100)error='粗利率は100％未満で入力してください。';else{v.net=v.cost/(1-v.rate/100);v.gross=v.net*1.1}}
else if(has('net')&&has('rate')){v.cost=v.net*(1-v.rate/100);v.gross=v.net*1.1}
else if(has('gross')&&has('rate')){v.net=v.gross/1.1;v.cost=v.net*(1-v.rate/100)}
else if(has('net')&&has('gross'))error='仕入れ値または粗利率も入力してください。';
const ready=chosen.length>=2&&!error;keys.forEach(k=>{const field=document.querySelector(`[data-key="${k}"]`),input=field.querySelector('input'),auto=ready&&!values[k]&&v[k]!==undefined;field.classList.toggle('calculated',auto);field.querySelector('small').textContent=auto?'自動計算':'';if(document.activeElement!==input)input.value=auto?(k==='rate'?v[k].toFixed(1):yen(v[k])):values[k]});
const err=document.querySelector('.error');err.textContent=error;err.style.display=error?'block':'none';const box=document.querySelector('.result');box.classList.toggle('ready',ready);box.querySelector('strong').textContent=ready?`${yen(v.net-v.cost)} 円`:'—';box.querySelector('span').textContent=ready?'税抜販売価格 − 仕入れ値':'2つ入力すると表示されます'}
document.querySelectorAll('input').forEach(input=>input.addEventListener('input',e=>{const k=e.target.closest('.field').dataset.key,raw=e.target.value.replaceAll(',','');if(!/^\d*(\.\d*)?$/.test(raw))return;values[k]=raw;edited=[...edited.filter(x=>x!==k),k];calc()}));
document.querySelector('.clear').addEventListener('click',()=>{keys.forEach(k=>values[k]='');edited=[];document.querySelectorAll('input').forEach(i=>i.value='');calc()});calc();
</script></body></html>
